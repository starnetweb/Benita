version: '3.9'

services:

  # Python agent — runs cron job at 6am Lagos (WAT = UTC+1 = 05:00 UTC)
  agent:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: blogger_agent
    restart: unless-stopped
    env_file: .env
    volumes:
      - blogger_db:/app/db
      - blogger_logs:/app/logs
    environment:
      - DB_PATH=/app/db/blogger.db
      - LOG_PATH=/app/logs/agent.log
      - TZ=Africa/Lagos

  # PHP admin panel
  admin:
    build:
      context: .
      dockerfile: Dockerfile.admin
    container_name: blogger_admin
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - blogger_db:/app/db:ro
      - blogger_logs:/app/logs:ro
    environment:
      - DB_PATH=/app/db/blogger.db
      - LOG_PATH=/app/logs/agent.log

volumes:
  blogger_db:
  blogger_logs:
