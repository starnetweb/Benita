services:

  agent:
    image: ghcr.io/starnetweb/benita-agent:latest
    container_name: blogger_agent
    restart: unless-stopped
    env_file: .env
    volumes:
      - blogger_db:/app/db
      - blogger_logs:/app/logs
    environment:
      - DB_PATH=/app/db/blogger.db
      - LOG_PATH=/app/logs/agent.log
      - TZ=Africa/Lagos

  admin:
    image: ghcr.io/starnetweb/benita-admin:latest
    container_name: blogger_admin
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - blogger_db:/app/db
      - blogger_logs:/app/logs
    environment:
      - DB_PATH=/app/db/blogger.db
      - LOG_PATH=/app/logs/agent.log
    depends_on:
      - agent

volumes:
  blogger_db:
  blogger_logs:
